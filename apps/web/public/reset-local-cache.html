<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free Video Local Cache Reset</title>
</head>
<body>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith('auria-shell-')).map(k => caches.delete(k)));
    }
  } catch (_) {}
  location.replace('/video?fresh=0.2.2.13');
})();
</script>
</body>
</html>
